write:
  replicas: 1
read:
  replicas: 1
backend:
  replicas: 1

loki:
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb  # 🔹 Change from boltdb-shipper to tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true  # 🔹 Enable structured metadata
  affinity: {}
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           labelSelector:
  #             matchExpressions:
  #               - key: app
  #                 operator: In
  #                 values:
  #                   - loki
  #           topologyKey: "kubernetes.io/hostname"

test:
  enabled: false

storage:
  type: 'filesystem'

minio:
  enabled: true

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
