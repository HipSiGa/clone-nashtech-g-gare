---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  minReadySeconds: 30
  selector:
    matchLabels:
      app: storefront
  replicas: 1
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront-bff
          image: ghcr.io/nashtech-garage/yas-storefront-bff:latest
          env:
            - name: SERVER_PORT
              value: "80"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_SLEUTH_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4317
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://identity.yas.local/auth/realms/Yas"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID
              value: "storefront-bff"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: storefront-bff-client-secret
          ports:
            - name: http
              containerPort: 80

