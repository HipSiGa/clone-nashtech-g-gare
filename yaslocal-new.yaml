---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:16.1.0
          env:
            - name: KEYCLOAK_USER
              value: "admin"
            - name: KEYCLOAK_PASSWORD
              value: "admin"
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: DB_VENDOR
              value: "POSTGRES"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin"
            - name: DB_ADDR
              value: "postgres"
            - name: DB_DATABASE
              value: "keycloak"
            - name: KEYCLOAK_IMPORT
              value: /tmp/realm-export.json
            - name: JAVA_OPTS
              value: >-
                -Djboss.as.management.blocking.timeout=600
                -Dkeycloak.metrics.enabled=false
                -Djboss.default.jgroups.stack=udp
                -Djgroups.join_timeout=0
                -Djboss.default.multicast.address=127.0.0.1
                -Djboss.tx.node.id=1
                -Djboss.node.name=node1
                -Djboss.bind.address=0.0.0.0
                -Djboss.bind.address.private=0.0.0.0
                -Djboss.bind.address.management=0.0.0.0
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - mountPath: /tmp/realm-export.json
              name: realm-config
              subPath: realm-export.json
          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /auth/realms/master
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /auth/realms/master
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config

---
## configmap for keycloak realm configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
data:
  realm-export.json: |
    {
      "realm": "Yas",
      "enabled": true,
      "sslRequired": "external",
      "roles": {
        "realm": [
          {
            "name": "user",
            "description": "Regular user"
          }
        ]
      },
      "clients": [
        {
          "clientId": "storefront-bff",
          "enabled": true,
          "publicClient": false,
          "redirectUris": [
            "http://storefront/*"
          ],
          "webOrigins": ["*"],
          "protocol": "openid-connect",
          "standardFlowEnabled": true
        }
      ]
    }

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: NodePort
  ports:
    - port: 5432
      nodePort: 30007
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  ports:
    - name: http
      port: 80
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_DB
              value: "keycloak"
          readinessProbe:
            exec:
              command:
                - psql
                - -U
                - admin
                - -d
                - keycloak
                - -c
                - "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - mountPath: "/var/lib/postgresql/data"
              name: postgredb
            - mountPath: /docker-entrypoint-initdb.d
              name: init-scripts
        - name: pgadmin
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@yas.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin"
          volumeMounts:
            - mountPath: "/var/lib/pgadmin"
              name: pgadmin
      volumes:
        - name: postgredb
          persistentVolumeClaim:
            claimName: postgres-pv-claim
        - name: pgadmin
          persistentVolumeClaim:
            claimName: pgadmin-pv-claim
        - name: init-scripts
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  type: NodePort
  ports:
    - name: web
      port: 80
      targetPort: 16686
    - name: otlpcollectorgprc
      port: 4317
      nodePort: 30017
    - name: otlpcollectorhttp
      port: 4318
      nodePort: 30018
  selector:
    app: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  minReadySeconds: 30
  selector:
    matchLabels:
      app: jaeger
  replicas: 1
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.36
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: "9411"
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 6831
            - containerPort: 6832
            - containerPort: 5778
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 14250
            - containerPort: 14268
            - containerPort: 14269
            - containerPort: 9411
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-volume
  labels:
    type: local
spec:
  storageClassName: local-storage
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/postgres"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube # Replace with your node name if different
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pgadmin-pv-volume
  labels:
    type: local
spec:
  storageClassName: local-storage
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/pgadmin"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube # Replace with your node name if different
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pv-claim
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-pv-claim
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    CREATE DATABASE keycloak;
    CREATE DATABASE media;
    CREATE DATABASE product;
    GRANT ALL PRIVILEGES ON DATABASE keycloak TO admin;
    GRANT ALL PRIVILEGES ON DATABASE media TO admin;
    GRANT ALL PRIVILEGES ON DATABASE product TO admin;


